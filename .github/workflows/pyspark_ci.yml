name: Run PySpark Job

on:
  push:
    branches:
      - main
      - dev
      - feature

jobs:
  run-spark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install PySpark
        run: |
          pip install pyspark

      - name: Run PySpark script
        run: |
          python3 "Resource/Notebook/process_sales_data.py"
